apiVersion: v1
kind: Service
metadata:
  name: textilecycle-service
  namespace: textilecycle
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: NodePort
  selector:
    app: textilecycle
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080