apiVersion: v1
kind: ConfigMap
metadata:
  name: textilecycle-config
  namespace: textilecycle
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://<APPLICATION_URL>"
  APP_NAME: "TextileCycle"
  APP_LOCALE: "fr"
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "warning"
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_DATABASE: "textilecycle"
  CACHE_STORE: "database"
  SESSION_DRIVER: "database"
  QUEUE_CONNECTION: "sync"